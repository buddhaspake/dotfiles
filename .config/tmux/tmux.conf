# Enable 256-color and true-color (24-bit) support in tmux
set -g default-terminal "screen-256color" # Set term type for 256 color support
set -ga terminal-overrides ",*256col*:Tc" # Override to enable truecolor for compatible terminals

# General
set -g set-clipboard on       # Use system clipboard
set -g mouse on               # Enable mouse support
set -g status-interval 3      # Update the status bar every 3 sec (default=15)
set -g detach-on-destroy off  # Don't exit tmux when closing a session

# Set prefix key
unbind C-b            # Unbind default prefix key
set -g prefix C-Space # Set new prefix key to Ctrl+Space

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Enable vi mode to allow vim movement
set-window-option -g mode-keys vi

# Don't exit copy while dragging mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on  # Automatically renumber windows when 1 is closed

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'
# Plugin configs
set -g @tmux-gruvbox 'dark'

# Status configs
set -g status-right "Hello, Sam"
set -g status-justify centre
set -g status-left-length 200
set -g status-right-length 200

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
